name: Publish Extension

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Package Extension
        run: npx vsce package

      - name: Publish to VS Code Marketplace
        run: |
          echo "Publishing to VS Code Marketplace..."
          npx vsce publish -p "${VSCE_PAT}"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''

      - name: Handle Publish Failure
        if: failure()
        run: |
          echo "Publishing failed. Please check:"
          echo "1. That your VSCE_PAT secret is correctly set in GitHub repository settings"
          echo "2. That the PAT has the correct permissions (Marketplace publish)"
          echo "3. That the PAT hasn't expired"
          echo "See PUBLISHING.md for detailed instructions."

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            *.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}