<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Window -->
  <rect x="0" y="0" width="800" height="600" fill="#2d2d30" rx="6" />
  <rect x="0" y="0" width="800" height="30" fill="#3c3c3c" rx="6" />
  <text x="15" y="20" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="600">JSON Block Editor</text>
  
  <!-- Content area -->
  <rect x="20" y="40" width="760" height="540" fill="#1e1e1e" />
  
  <!-- Header -->
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="600">JSON Block Editor</text>
  <rect x="40" y="80" width="720" height="30" fill="#2d2d30" />
  <text x="50" y="100" font-family="Arial, sans-serif" font-size="12" fill="#999999">/workspace/project/config/app.json</text>
  <rect x="650" y="85" width="100" height="20" fill="#0e639c" rx="2" />
  <text x="665" y="99" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Open Source File</text>
  <text x="40" y="125" font-family="Arial, sans-serif" font-size="14" fill="#cccccc">Edit individual JSON blocks using dot notation paths</text>
  
  <!-- Toolbar -->
  <text x="40" y="155" font-family="Arial, sans-serif" font-size="12" fill="#cccccc">View Depth:</text>
  <rect x="120" y="145" width="80" height="20" fill="#3c3c3c" stroke="#3c3c3c" rx="2" />
  <text x="150" y="159" font-family="Arial, sans-serif" font-size="12" fill="#cccccc">2 ▼</text>
  
  <rect x="500" y="145" width="200" height="20" fill="#3c3c3c" stroke="#3c3c3c" rx="2" />
  <text x="510" y="159" font-family="Arial, sans-serif" font-size="12" fill="#999999">Search blocks by key...</text>
  <rect x="710" y="145" width="60" height="20" fill="#0e639c" rx="2" />
  <text x="730" y="159" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Search</text>
  
  <!-- Block Group -->
  <rect x="40" y="180" width="720" height="320" fill="#252526" stroke="#3c3c3c" rx="4" />
  <rect x="40" y="180" width="720" height="30" fill="#2d2d30" stroke="#3c3c3c" />
  <text x="55" y="200" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="600">Depth Level 2</text>
  
  <!-- Block 1 -->
  <rect x="50" y="220" width="700" height="60" fill="#252526" />
  <line x1="50" y1="250" x2="750" y2="250" stroke="#3c3c3c" />
  <text x="60" y="240" font-family="Monaco, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="600">config.db.host</text>
  <text x="725" y="240" font-family="Arial, sans-serif" font-size="16" fill="#f48771">🗑</text>
  <rect x="60" y="260" width="580" height="24" fill="#3c3c3c" />
  <text x="70" y="276" font-family="Monaco, Consolas, monospace" font-size="12" fill="#cccccc">localhost</text>
  <rect x="650" y="260" width="80" height="24" fill="#0e639c" rx="2" />
  <text x="680" y="276" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Edit</text>
  <text x="670" y="295" font-family="Arial, sans-serif" font-size="11" fill="#999999">Depth: 2</text>
  
  <!-- Block 2 -->
  <rect x="50" y="290" width="700" height="60" fill="#252526" />
  <line x1="50" y1="320" x2="750" y2="320" stroke="#3c3c3c" />
  <text x="60" y="310" font-family="Monaco, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="600">config.db.port</text>
  <text x="725" y="310" font-family="Arial, sans-serif" font-size="16" fill="#f48771">🗑</text>
  <rect x="60" y="330" width="580" height="24" fill="#3c3c3c" />
  <text x="70" y="346" font-family="Monaco, Consolas, monospace" font-size="12" fill="#cccccc">5432</text>
  <rect x="650" y="330" width="80" height="24" fill="#0e639c" rx="2" />
  <text x="680" y="346" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Edit</text>
  <text x="670" y="365" font-family="Arial, sans-serif" font-size="11" fill="#999999">Depth: 2</text>
  
  <!-- Block 3 -->
  <rect x="50" y="360" width="700" height="60" fill="#252526" />
  <line x1="50" y1="390" x2="750" y2="390" stroke="#3c3c3c" />
  <text x="60" y="380" font-family="Monaco, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="600">config.api.url</text>
  <text x="725" y="380" font-family="Arial, sans-serif" font-size="16" fill="#f48771">🗑</text>
  <rect x="60" y="400" width="580" height="24" fill="#3c3c3c" />
  <text x="70" y="416" font-family="Monaco, Consolas, monospace" font-size="12" fill="#cccccc">"http://api.example.com"</text>
  <rect x="650" y="400" width="80" height="24" fill="#0e639c" rx="2" />
  <text x="680" y="416" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Edit</text>
  <text x="670" y="435" font-family="Arial, sans-serif" font-size="11" fill="#999999">Depth: 2</text>
  
  <!-- Block 4 -->
  <rect x="50" y="430" width="700" height="60" fill="#252526" />
  <line x1="50" y1="460" x2="750" y2="460" stroke="#3c3c3c" />
  <text x="60" y="450" font-family="Monaco, Consolas, monospace" font-size="13" fill="#ffffff" font-weight="600">config.api.timeout</text>
  <text x="725" y="450" font-family="Arial, sans-serif" font-size="16" fill="#f48771">🗑</text>
  <rect x="60" y="470" width="580" height="24" fill="#3c3c3c" />
  <text x="70" y="486" font-family="Monaco, Consolas, monospace" font-size="12" fill="#cccccc">5000</text>
  <rect x="650" y="470" width="80" height="24" fill="#0e639c" rx="2" />
  <text x="680" y="486" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Edit</text>
  <text x="670" y="505" font-family="Arial, sans-serif" font-size="11" fill="#999999">Depth: 2</text>
  
  <!-- Action Buttons -->
  <rect x="40" y="510" width="180" height="30" fill="#3a3d41" rx="2" />
  <text x="60" y="530" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Add Block to this level</text>
  
  <rect x="230" y="510" width="120" height="30" fill="#0e639c" rx="2" />
  <text x="255" y="530" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Save Changes</text>
  
  <rect x="360" y="510" width="140" height="30" fill="#3a3d41" rx="2" />
  <text x="380" y="530" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Reload Document</text>
</svg>